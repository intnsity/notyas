# The board-independent UI layer of notyas: screens, state machine, Butter Paper theme.
# Draws into any embedded-graphics Rgb565 DrawTarget, so the same crate serves the device
# framebuffer and the host simulator (tools/uisim) unchanged. no_std + alloc for the same
# reason notyas-core is: portability across the std/no_std firmware split, and a smaller
# audit surface.
[package]
name = "notyas-ui"
version = "0.2.3"
edition = "2021"
rust-version = "1.85"
description = "Board-independent Butter Paper UI for the notyas device: screens, touch state machine, masking discipline"
license = "GPL-3.0-or-later"
repository = "https://github.com/intnsity/notyas"
publish = false

[dependencies]
# The drawing vocabulary (Rectangle, clipped targets). 0.8 is built on
# embedded-graphics-core 0.4, the same core notyas-fonts targets, so the color and
# DrawTarget types are identical across the three crates. Pure Rust, no_std.
embedded-graphics = "0.8"
# The pipeline this UI fronts. default-features = false drops the "qr" feature (qrcode
# needs std): this crate NEVER computes a QR code - it renders precomputed matrices
# handed in via Ui::show_qr (the firmware answers Ui::touch's UiRequest::Qr with the
# core's std-side encoder) - which keeps the crate provable on a bare-metal target
# exactly like the core. See src/qr.rs and the crate-level "QR scope" docs.
notyas-core = { path = "../notyas-core", default-features = false }
# Committed notyas Sans / notyas Mono glyph atlases and the text renderer.
notyas-fonts = { path = "../notyas-fonts" }
# `bitcoin` (needed only for `Network::Bitcoin`) comes through notyas-core's re-export,
# so this crate can never pin a different version or feature set than the pipeline runs.
# Same discipline as notyas-core: every buffer that held rolls, words or a passphrase is
# wiped when its screen is left, not merely dropped.
zeroize = "1"

[dev-dependencies]
# The unit and integration tests run on the host under std; the library never links it.
# embedded-graphics is repeated here so the integration tests can implement a test
# framebuffer against the same trait version the crate draws to.
embedded-graphics = "0.8"
zeroize = "1"
