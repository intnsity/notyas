# Host-side UI simulator and graphics regression gate for notyas.
#
# A library plus a thin binary, deliberately: the docs pictures, the gate in
# tests/gate.rs and the render/diff commands all drive ONE catalogue of frames
# through ONE set of driving helpers with ONE set of sample data. A second crate
# holding a second copy of that data would drift, and the committed pictures would
# stop being evidence about the thing under gate.
#
# The library renders every screen, in every state src/catalog.rs declares it has, on
# every panel notyas_ui::layout::PANELS ships, into a target that RECORDS what a
# display would discard - so a draw that leaves the glass is measurable instead of
# invisible. Same input -> same bytes: each docs picture is rendered twice and refused
# on any divergence.
#
# Commands: `tour` (default) writes docs/screenshots/ui; `approve` runs the bounds and
# coverage gates and only then rewrites goldens.txt and the pictures; `manifest` prints
# the manifest and writes nothing; `render` and `diff` are for looking at one frame.
[package]
name = "uisim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Renders every notyas-ui screen on every shipped panel, and gates the result"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
notyas-ui = { path = "../../crates/notyas-ui" }
# The simulator plays the firmware's role in the QR round trip: notyas-ui only ever
# renders a precomputed matrix (it stays no_std), so the QR request returned by
# `Ui::touch` is answered here with the core's std-side encoder - default features
# keep the `qr` feature on, exactly as the firmware does.
notyas-core = { path = "../../crates/notyas-core" }
# Same trait version notyas-ui draws to; the simulator's framebuffer implements it.
embedded-graphics = "0.8"
# PNG encoding only. `png` over `image`: image is a facade over a dozen codecs of which
# exactly one is needed; png is that one codec, dependency-light and deterministic.
png = "0.17"
