[package]
name = "notyas-firmware"
version = "0.2.3"
authors = ["intnsity <at@intnsity.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.77"

[[bin]]
name = "notyas-firmware"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

# [profile.release] and [profile.dev] moved to the workspace root Cargo.toml:
# cargo ignores [profile.*] in non-root workspace members.

[features]
# Exactly one board feature must be enabled (enforced in src/board/mod.rs).
# There is deliberately no default: the build IS the board (docs/BOARDS.md),
# and a build that does not name its hardware must fail, not guess.
default = []
board-waveshare-4b = []
board-waveshare-5 = []
board-waveshare-7b = []
board-waveshare-7x = []
board-waveshare-8x = []
board-waveshare-101x = []
board-elecrow-5 = []
board-elecrow-7 = []
board-elecrow-9 = []
board-elecrow-101 = []

# Temporary hardware-measurement harness for the 0.2.0 m1 storage freeze
# (src/measure.rs, docs/plan-0.2.0/MEASUREMENTS.md). OFF by default and pulled in
# by nothing else: with the feature off the module is not compiled, `argon2` is
# not in the dependency graph, and the image is byte-for-byte the product image.
# A measurement build never returns from the harness - it is not a product image.
measure = ["dep:argon2"]

# The panel calibration instrument (src/diag.rs): a frame whose entire content is
# its own coordinates, so an operator can read off the GLASS which framebuffer
# columns and rows actually reach it - the one question source reading cannot
# answer when a panel shows a shifted picture. OFF by default, pulled in by
# nothing else, and a build that has it never reaches the product UI: it lights
# the panel and holds the frame for the power cycle. An instrument, not a screen.
diag-display = []

# The esp-idf-hmac exercise against VIRTUAL eFuses (src/hmac_check.rs). OFF by
# default and never enabled by a release build. It is the only configuration in
# this tree that compiles a call to an eFuse write API, and it is safe only in
# combination with firmware/sdkconfig.efuse-virtual.defaults - which
# esp-idf-hmac's build script enforces: with `provisioning` on and
# CONFIG_EFUSE_VIRTUAL off, the build fails rather than producing an image that
# could program a fuse.
hmac-virtual-check = ["esp-idf-hmac/provisioning"]

# ESP-SEAL.md 6.4 fence 1. Substitutes a COMPILED-IN device-binding key for the
# read-protected eFuse block, so storage logic can be exercised on boards whose
# fuses must stay virgin. Deliberately ugly, never a default, and never enabled
# by a release build: fence 2 is build.rs, which fails the build outright unless
# the image is bench-shaped in every property cargo reports (debug assertions,
# profile root, optimization level and debuginfo, all four read together - the
# reasoning is in build.rs). Fences 3 and 4 make it harmless even if it
# somehow shipped - the provenance byte is inside every AEAD's associated data,
# so a record sealed under this key cannot be opened by a production build, and
# a product Config accepts only KeyProvenance::EfuseReadProtected at mount.
unsafe-emulated-key = ["dep:hmac", "dep:sha2"]

# The hardware-in-the-loop test console (src/hil.rs): a line-oriented serial
# command set that drives the store directly, so a bench operator can run the
# known-answer test, format, seal, cut power and read the ledger back - and, since
# 0.2.0, register a multisig wallet, review a PSBT and SIGN it, which is how
# MILESTONES.md section 9 clause 2 is driven before the m4b screens exist. It is how
# m4a's manual power-cut gate is evidenced (MILESTONES.md m4a test method) and it
# is OFF by default. Three layers stand between it and a shipped image, and they
# are deliberately of three different kinds: build.rs refuses the feature unless
# the image is bench-shaped in EVERY property cargo reports - debug assertions,
# profile root, optimization level, debuginfo - and any one product-shaped answer
# stops the artefact existing; src/hil.rs carries a compile_error! that rustc
# evaluates on the module itself, requiring both its own debug_assertions and the
# cfg build.rs sets when that conjunction held, so the layer holds when a build
# script is skipped or stubbed and refuses when its verdict is simply absent; and
# tools/ci/check-release-symbols.sh asserts the console's symbols are absent from
# the linked ELF, in EVERY profile directory it can find rather than the two it
# used to expect (Q41). Only the third is evidence: the first two are promises
# made by the build, and this project ships to strangers who can read an image but
# cannot audit our build invocation.
#
# The conjunction is not belt-and-braces, it is the lesson. A one-property fence
# has now failed twice in opposite directions - `PROFILE == "release"` waved
# through a dev-rooted image with shipping codegen, and the debug-assertions bit
# that replaced it waved through `[profile.hardened] inherits = "release",
# debug-assertions = true`, which cleared build.rs and hil.rs at once because both
# read the same bit. Neither layer may narrow to one property again.
hil-console = ["dep:hmac", "dep:sha2"]

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52", features = ["binstart"] }
embedded-graphics = "0.8"
# The product crates, path-pinned to this repo. The core's "qr" feature is enabled
# HERE and only here: the qrcode encoder needs std, which this firmware has and
# notyas-ui (no_std, it renders precomputed matrices only) must never grow - the UI
# crate keeps default-features = false, and its bare-metal riscv32imac check proves
# the feature does not leak into that graph. m4 QR flow: Ui::touch returns
# UiRequest::Qr, main.rs encodes the (public) payload with qr::matrix and hands the
# finished matrix back via Ui::show_qr.
#
# The PSBT engine (m6) and the multisig registry (m7) need NO feature: `psbt` and
# `multisig` are unconditional modules of notyas-core (its lib.rs), and its only cargo
# feature is `qr`. So src/signing.rs and src/wallet/ compile against the graph that was
# already here, and tools/build-graph-check.sh reports the same tree it did before this
# line was written - no `rand`, no `getrandom`, and nothing new under notyas-ui.
notyas-core = { path = "../crates/notyas-core", default-features = false, features = ["qr"] }
notyas-ui = { path = "../crates/notyas-ui" }
# Used directly for the selftest-failure screen (main.rs), which is deliberately NOT a
# notyas-ui screen: it must render even when the crate under test is the one that failed.
notyas-fonts = { path = "../crates/notyas-fonts" }
# The eFuse and HMAC-peripheral surface behind src/readout.rs. A DIRECT
# dependency on purpose: esp-idf-sys collects `extra_components` from the root
# crate and from its direct dependencies only, so this is what brings that
# crate's bindings header (esp_hmac.h and the eFuse surface) into the build.
# MIT OR Apache-2.0 and holds no notyas policy - see its README for why the
# licence split matters and why nothing product-specific may enter it.
esp-idf-hmac = { path = "../crates/esp-idf-hmac" }
# Measurement harness only (feature `measure`). default-features = false keeps the
# `rand` / `password-hash` surface out of the graph - the harness calls the raw
# hash_password_into_with_memory API with a scratch buffer it allocates itself, so
# the crate never needs an allocator or an RNG (SECURITY.md invariant 3).
argon2 = { version = "0.5", default-features = false, optional = true }
# The sealing and storage engine. no_std, no RNG, no clock: it borrows this
# crate's flash, MAC and Argon2 scratch through src/store/ and computes
# everything else itself. `testkit` is NEVER enabled here - it would pull the
# host power-loss simulator into the device image, and tools/build-graph-check.sh
# asserts it is absent.
notyas-wallet = { path = "../crates/notyas-wallet" }
# Software HMAC-SHA256, for the development key substitute and the known-answer
# test only (src/store/mac.rs). Both are feature-gated; a product image links
# neither. Versions match notyas-wallet's so the workspace resolves one copy.
hmac = { version = "0.13.0", default-features = false, optional = true }
sha2 = { version = "0.11.0", default-features = false, optional = true }
# Wiping. PRODUCT code, not a feature: src/wallet holds an open wallet's 64-byte seed
# and the mnemonic it came from between the AEAD and the parse, and those need the same
# discipline notyas-core applies to them rather than a hand-rolled memset a compiler is
# free to elide. (It was optional and gated on `hil-console` until the product signing
# path landed; the test console's use of it is now one caller among two.) The pin matches
# notyas-wallet's so the workspace resolves one copy, and the crate is already in the
# graph through notyas-core - this adds nothing new to the image.
zeroize = { version = "1.9.0", default-features = false, features = ["alloc"] }

[build-dependencies]
embuild = "0.33"

# Display/touch C components from the ESP component registry, pulled into the
# esp-idf-sys build by embuild's component manager. Each bindings_header adds
# that component's API (plus the esp_lcd/LDO/i2c_master surface it needs) to
# the generated esp_idf_sys bindings.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp_lcd_st7703", version = "^2" }
bindings_header = "bindings/st7703.h"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_touch_gt911", version = "^1" }
bindings_header = "bindings/gt911.h"

# Elecrow CrowPanel Advanced boards. The EK79007 DSI panel driver serves the
# Elecrow 7/9/10.1 inch siblings AND the Waveshare Touch-LCD-7B (same
# controller; ^1 suffices for both - the 2.x line only adds IDF6
# compatibility per its CHANGELOG). The bindings header also surfaces the
# core-IDF RGB panel API used by the Elecrow 5 inch. NOTE: esp-idf-sys
# package metadata cannot be feature-gated, so every board build compiles
# all components and carries all bindings - the cfg-gated Rust in src/board/
# only ever calls its own board's surface (the security argument lives in
# what runs, but keep this in mind when auditing the C side of the image).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/esp_lcd_ek79007", version = "^1" }
bindings_header = "bindings/elecrow.h"

# Waveshare Touch-LCD-5 (board-waveshare-5): HX8394 DSI panel driver - the
# 5 BSP's own component pin (its default init table IS this panel's).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp_lcd_hx8394", version = "^2.1.0" }
bindings_header = "bindings/hx8394.h"

# Waveshare Touch-LCD-7 "X" (board-waveshare-7x): ILI9881C DSI panel driver;
# its default init table was verified identical to the X BSP's 7-inch table.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp_lcd_ili9881c", version = "^2" }
bindings_header = "bindings/ili9881c.h"

# Waveshare Touch-LCD-8 / -10.1 "X" (board-waveshare-8x / -101x): per-size
# JD9365 drivers whose default init tables carry each panel's command set
# (the X BSP feeds the same data to a generic driver). Distinct exported
# symbols (esp_lcd_new_panel_jd9365_8 vs esp_lcd_new_panel_jd9365), so both
# can ride in every build without clashing (see the NOTE above).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp_lcd_jd9365_8", version = "^2" }
bindings_header = "bindings/jd9365_8.h"

[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "waveshare/esp_lcd_jd9365_10_1", version = "^2" }
bindings_header = "bindings/jd9365_10_1.h"

# Verify-screen surface (SECURITY.md invariant 5). No component is built - the entry
# only widens the bindgen surface with the running-partition hash and the secure-boot /
# flash-encryption / chip-revision eFuse readout APIs (see the header's comments).
[[package.metadata.esp-idf-sys.extra_components]]
bindings_header = "bindings/verify.h"
